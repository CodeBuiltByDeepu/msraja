<head>

    <!-- Google Font -->

    <!-- Font Awesome (optional icons) -->

    <style>
        /* ================= FOOTER ================= */
.site-footer {
    background: radial-gradient(circle at top, #020617, #0b0f19);
    color: #9ca3af;
    margin-top: 80px;
}

.footer-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 40px;
    padding: 60px 10%;
}

/* Footer Box */
.footer-box h3 {
    color: #facc15;
    font-size: 18px;
    margin-bottom: 18px;
    position: relative;
}

/* Decorative underline */
.footer-box h3::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 40px;
    height: 3px;
    background: #ef4444;
    border-radius: 3px;
}

.footer-box ul {
    list-style: none;
}

.footer-box ul li {
    margin-bottom: 12px;
}

.footer-box ul li a {
    color: #9ca3af;
    font-size: 14px;
    transition: 0.3s ease;
    display: inline-block;
}

.footer-box ul li a:hover {
    color: #ef4444;
    transform: translateX(6px);
}

/* Contact Info */
.footer-box p {
    font-size: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.footer-box i {
    color: #ef4444;
    font-size: 15px;
}

/* ================= SOCIAL ICONS ================= */
.social-icons {
    margin-top: 18px;
    display: flex;
    gap: 12px;
}

.social-icons a {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.35);

    border-radius: 50%;
    color: #ffffff;

    transition: all 0.4s ease;
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.25);
}

.social-icons a:hover {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 20px 45px rgba(239, 68, 68, 0.45);
}

/* ================= FOOTER BOTTOM ================= */
.footer-bottom {
    background: #020617;
    text-align: center;
    padding: 15px;
    font-size: 13px;
    color: #9ca3af;
    border-top: 1px solid rgba(255,255,255,0.05);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
    .footer-container {
        padding: 50px 6%;
        text-align: center;
    }

    .footer-box h3::after {
        left: 50%;
        transform: translateX(-50%);
    }

    .footer-box p {
        justify-content: center;
    }

    .social-icons {
        justify-content: center;
    }
}

@media (max-width: 480px) {
    .footer-container {
        gap: 30px;
    }
}

    </style>

   
</head>
<body>

    <!-- Header -->
    <a href="mobile.html" class="back-home-btn">

    <span class="back-text">Back to Home</span>
</a>
>

    <!-- Hero -->
    <section class="gallery-hero">
        <h2>Explore Our Work</h2>
        <p>A glimpse of our products, services, and professional work delivered with quality and trust.</p>
    </section>

    <!-- Gallery Grid -->
    <section class="gallery-grid">

        <div class="gallery-card"><img src="Ms mobile/Mobile phones.png" alt="Gallery Image"></div>

        <div class="gallery-card"><img src="Ms mobile/Mobile phones.png" alt="Gallery Image"></div>
        <div class="gallery-card"><img src="Ms mobile/Mobile phones.png" alt="Gallery Image"></div>
        <div class="gallery-card"><img src="Ms mobile/Mobile phones.png" alt="Gallery Image"></div>
    </section>

    <!-- Footer -->
    <footer class="gallery-footer">
        <p>© 2026 Ms Raja Mobile | Designed with ❤️ for Local Business</p>

</html>
